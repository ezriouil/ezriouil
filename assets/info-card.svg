<svg xmlns="http://www.w3.org/2000/svg" width="490" height="390" viewBox="0 0 490 390">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; }
    .dot-red { fill: #ff5f56; } .dot-yellow { fill: #ffbd2e; } .dot-green { fill: #27c93f; }
    .title, .key, .value, .prompt { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .title { fill: #8b949e; font-size: 11px; } .prompt { fill: #39d353; font-size: 15px; font-weight: 700; }
    .key { fill: #8b949e; font-size: 13px; } .value { font-size: 13px; }
    .line { opacity: 0; animation: reveal .42s ease-out forwards; }
    .cursor { fill: #39d353; animation: blink .8s steps(1) infinite; }
    @keyframes reveal { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect class="bg" x="1" y="1" width="488" height="388" rx="12"/>
  <circle class="dot-red" cx="18" cy="18" r="5"/><circle class="dot-yellow" cx="35" cy="18" r="5"/><circle class="dot-green" cx="52" cy="18" r="5"/>
  <text class="title" x="245" y="22" text-anchor="middle">mohamed@github: ~</text>
  <text class="prompt" x="30" y="62">$ whoami</text>
  <g class="line" style="animation-delay:0.35s"><text x="32" y="106" class="key">user</text><text x="142" y="106" fill="#58a6ff" class="value">Mohamed Ezriouil</text></g><g class="line" style="animation-delay:0.53s"><text x="32" y="148" class="key">role</text><text x="142" y="148" fill="#c9d1d9" class="value">Software Engineer</text></g><g class="line" style="animation-delay:0.71s"><text x="32" y="190" class="key">focus</text><text x="142" y="190" fill="#39d353" class="value">Mobile · Web · AI</text></g><g class="line" style="animation-delay:0.89s"><text x="32" y="232" class="key">building</text><text x="142" y="232" fill="#c9d1d9" class="value">Products from idea to production</text></g><g class="line" style="animation-delay:1.07s"><text x="32" y="274" class="key">based</text><text x="142" y="274" fill="#c9d1d9" class="value">Morocco</text></g><g class="line" style="animation-delay:1.25s"><text x="32" y="316" class="key">status</text><text x="142" y="316" fill="#f2cc60" class="value">Open to collaboration</text></g>
  <text class="prompt" x="30" y="364">$ <tspan class="cursor">_</tspan></text>
</svg>